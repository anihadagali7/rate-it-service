name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  test:
    # Keep the job name stable: branch protection requires a check named "test".
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Same major version Heroku uses (package.json engines).
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
