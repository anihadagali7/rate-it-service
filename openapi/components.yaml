# Shared OpenAPI components. swagger-jsdoc merges this file with the
# `@openapi` blocks in routes/*.js — run `npm run openapi` after editing.
components:
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: >-
        The JWT returned by signup/login, sent as the raw header value — no
        `Bearer ` prefix.

  responses:
    ValidationError:
      description: The request body failed validation. `msg` describes the first problem.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TokenNotFound:
      description: No `Authorization` header was sent (`"Token not found"`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidToken:
      description: >-
        The token is invalid or expired, or its user is inactive
        (`"Invalid token"`). The UI logs the user out on this response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested user or media doesn't exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServerError:
      description: >-
        An unexpected error (`"Something went wrong. Please try again."`). Details
        are logged on the server, never returned.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: >-
        Too many requests from this IP (`"Too many requests. Please try again
        later."`). `RateLimit-*` headers describe the window.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadGateway:
      description: >-
        An external service (TMDB, Spotify, Google Books, SendGrid, or
        Cloudinary) failed. `msg` names the service.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      required: [errors]
      properties:
        errors:
          type: object
          required: [msg]
          properties:
            msg:
              type: string
              example: User not found

    ObjectId:
      type: string
      pattern: "^[a-f0-9]{24}$"
      example: 63019b905ccf53564ffb0c84

    # Source: utils/userSerializer.js (PUBLIC_USER_FIELDS). Safe to show any user.
    PublicUser:
      type: object
      required: [_id]
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        userName:
          type: string
          description: Missing until a social sign-up completes their profile.
        firstName:
          type: string
        lastName:
          type: string
        picture:
          type: string
          description: Profile picture URL.
        followers:
          type: array
          description: userNames of followers.
          items:
            type: string
        following:
          type: array
          description: userNames this user follows.
          items:
            type: string

    # Source: utils/userSerializer.js (ACCOUNT_USER_FIELDS + isProfileComplete).
    # Only ever returned for the authenticated user's own account.
    AccountUser:
      allOf:
        - $ref: "#/components/schemas/PublicUser"
        - type: object
          required: [isProfileComplete]
          properties:
            email:
              type: string
              format: email
            phoneNumber:
              type: string
            isActive:
              type: boolean
            isAdmin:
              type: boolean
            isEmailVerified:
              type: boolean
            isProfileComplete:
              type: boolean
              description: False until the user has a userName.

    AuthSuccess:
      type: object
      required: [status, accessToken, data]
      properties:
        status:
          type: string
          enum: [success]
        accessToken:
          type: string
          description: JWT to send as the `Authorization` header.
        data:
          type: object
          required: [user]
          properties:
            user:
              $ref: "#/components/schemas/AccountUser"

    AccountUserResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [user]
          properties:
            user:
              $ref: "#/components/schemas/AccountUser"

    # Source: repository/mediaModel.js. Only `name` is required by the model;
    # POST /api/media/add can store media without a mediaType.
    Media:
      type: object
      required: [_id, name]
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        name:
          type: string
        mediaType:
          type: string
          enum: [MOVIE, BOOK, PODCAST, TV, MUSIC, THEATRE]
        mediaId:
          type: string
          description: ID in the source catalog (TMDB, Spotify, Google Books).
        picture:
          type: string
        description:
          type: string
        tagLine:
          type: string
        genre:
          type: string
        album:
          type: string
        dateReleased:
          type: string
          format: date-time
        artist:
          type: array
          items:
            type: string
        author:
          type: array
          items:
            type: string
        producer:
          type: array
          items:
            type: string
        director:
          type: array
          items:
            type: string
        host:
          type: array
          items:
            type: string
        cast:
          type: array
          items:
            type: string
        __v:
          type: integer

    # Source: repository/ratingModel.js (as stored).
    Rating:
      type: object
      required: [_id, media, ratedBy, rating]
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        media:
          $ref: "#/components/schemas/ObjectId"
        ratedBy:
          $ref: "#/components/schemas/ObjectId"
        rating:
          type: string
          description: The score. Stored as a string.
          example: "8"
        comments:
          type: string
          description: The review text.
        isActive:
          type: boolean
        dateCreated:
          type: string
          format: date-time
        dateUpdated:
          type: string
          format: date-time
        __v:
          type: integer

    # Source: services/ratingService.js (prepareRatingsList).
    RatingComment:
      type: object
      required: [_id, text, commentedBy, likeCount, likedByCurrentUser]
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        text:
          type: string
        dateCreated:
          type: string
          format: date-time
        commentedBy:
          nullable: true
          description: Null if the commenter no longer exists.
          allOf:
            - $ref: "#/components/schemas/PublicUser"
        likeCount:
          type: integer
        likedByCurrentUser:
          type: boolean
          description: Always false for anonymous requests.

    # Source: services/ratingService.js (prepareRatingsList). A stored rating
    # with media, author, likes and comments filled in.
    RatingListItem:
      type: object
      required:
        - _id
        - rating
        - media
        - ratedBy
        - likeCount
        - likedByCurrentUser
        - commentList
        - commentCount
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        rating:
          type: string
          example: "8"
        comments:
          type: string
        isActive:
          type: boolean
        dateCreated:
          type: string
          format: date-time
        dateUpdated:
          type: string
          format: date-time
        __v:
          type: integer
        media:
          nullable: true
          description: Null if the media no longer exists.
          allOf:
            - $ref: "#/components/schemas/Media"
        ratedBy:
          nullable: true
          description: Null if the author no longer exists.
          allOf:
            - $ref: "#/components/schemas/PublicUser"
        likeCount:
          type: integer
        likedByCurrentUser:
          type: boolean
          description: Always false for anonymous requests.
        commentList:
          type: array
          description: Oldest first.
          items:
            $ref: "#/components/schemas/RatingComment"
        commentCount:
          type: integer

    RatingsListResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [ratingsList]
          properties:
            ratingsList:
              type: array
              description: Newest first.
              items:
                $ref: "#/components/schemas/RatingListItem"

    # A success response with no data (follow, unfollow, resend-verification).
    StatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [success]

    # Source: services/userService.js (getAccountDetails).
    UserProfileResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [user]
          properties:
            user:
              description: >-
                An `AccountUser` when the caller views their own profile,
                otherwise a `PublicUser`.
              anyOf:
                - $ref: "#/components/schemas/AccountUser"
                - $ref: "#/components/schemas/PublicUser"

    # Source: services/userService.js (getAllUsers, getAllFollowing,
    # getAllFollowers). `data` is the array itself, not a named payload.
    PublicUserListResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: array
          items:
            $ref: "#/components/schemas/PublicUser"

    # Source: services/userService.js (getAllFriends).
    FriendsListResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [followersList, followingList]
          properties:
            followersList:
              type: array
              items:
                $ref: "#/components/schemas/PublicUser"
            followingList:
              type: array
              items:
                $ref: "#/components/schemas/PublicUser"

    # Source: services/mediaService.js
    MediaResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [media]
          properties:
            media:
              $ref: "#/components/schemas/Media"

    # Source: services/searchService.js (buildMovieTvResult).
    MovieTvSearchResult:
      type: object
      required: [mediaId, poster, mediaType]
      properties:
        mediaId:
          type: integer
          description: TMDB id.
        name:
          type: string
        description:
          type: string
        poster:
          type: string
          description: Poster URL, or an empty string when TMDB has none.
        mediaType:
          type: string
          enum: [movie, tv]

    # Source: services/searchService.js (buildMusicResult).
    MusicSearchResult:
      type: object
      required: [mediaId, artists, mediaType]
      properties:
        mediaId:
          type: string
          description: Spotify track id.
        name:
          type: string
        albumType:
          type: string
        albumName:
          type: string
        poster:
          type: string
          description: Set only when Spotify has a 640px album image.
        artists:
          type: string
          description: Artist names joined with commas.
        mediaType:
          type: string
          enum: [music]

    # Source: services/searchService.js (buildBookResult).
    BookSearchResult:
      type: object
      required: [mediaId, mediaType]
      properties:
        mediaId:
          type: string
          description: Google Books volume id.
        name:
          type: string
        author:
          type: string
          description: Author names joined with commas.
        description:
          type: string
        poster:
          type: string
        mediaType:
          type: string
          enum: [book]

    MovieTvSearchResponse:
      type: object
      required: [status, data, mediaType]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [mediaList, totalPages]
          properties:
            mediaList:
              type: array
              items:
                $ref: "#/components/schemas/MovieTvSearchResult"
            totalPages:
              type: integer
        mediaType:
          type: string
          enum: [movie, tv]

    MusicSearchResponse:
      type: object
      required: [status, data, mediaType]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [mediaList, totalPages]
          properties:
            mediaList:
              type: array
              items:
                $ref: "#/components/schemas/MusicSearchResult"
            totalPages:
              type: integer
        mediaType:
          type: string
          enum: [music]

    BookSearchResponse:
      type: object
      required: [status, data, mediaType]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [mediaList, totalPages]
          properties:
            mediaList:
              type: array
              items:
                $ref: "#/components/schemas/BookSearchResult"
            totalPages:
              type: integer
        mediaType:
          type: string
          enum: [book]

    SearchRequest:
      type: object
      required: [keyWord]
      properties:
        keyWord:
          type: string
        page:
          type: integer
          minimum: 1
          description: 1-based page number. Defaults to the first page.
